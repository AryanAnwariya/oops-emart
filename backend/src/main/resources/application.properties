# Email Configuration (Gmail SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

# Application Email Settings
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:noreply@localhost}}
app.mail.from-name=E-Mart Platform

# --- Authentication tokens ---
# JWT_SECRET is REQUIRED (>= 32 random bytes); there is deliberately no default.
app.jwt.secret=${JWT_SECRET:}
app.jwt.issuer=${JWT_ISSUER:emart}
# ISO-8601 duration, e.g. PT30M
app.jwt.ttl=${JWT_TTL:PT30M}


# Local demos without SMTP only: print OTP codes to the console when email fails. Never enable in production.
app.otp.log-codes=${OTP_LOG_CODES:false}
